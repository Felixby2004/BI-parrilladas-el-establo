services:
  db:
    image: postgres:15-alpine
    container_name: establo_db
    restart: always
    environment:
      POSTGRES_USER: establo_user
      POSTGRES_PASSWORD: establo_pass
      POSTGRES_DB: establo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U establo_user -d establo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: establo_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@establo.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
