services:
  db:
    image: postgres:18-alpine
    container_name: establo_db
    restart: always
    environment:
      POSTGRES_USER: establo_user
      POSTGRES_PASSWORD: establo_pass
      POSTGRES_DB: establo_db
    ports:
      - "5432:5432"
    volumes:
      # En postgres:18 PGDATA vive dentro de /var/lib/postgresql/<major>/docker.
      - pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U establo_user -d establo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: establo_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@establo.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pg18_data:
