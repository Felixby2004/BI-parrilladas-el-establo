name: establo-impulse

# Despliegue en Dokploy (tipo Compose).
# Variables en .env junto a este archivo o cargadas en Dokploy.
# Ver .env.production.example y la sección "Despliegue" del README.

services:
  db_oltp:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg18_oltp_data:/var/lib/postgresql
      - ./db/postgres/oltp:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db_mart:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MART_USER}
      POSTGRES_PASSWORD: ${MART_PASSWORD}
      POSTGRES_DB: ${MART_DB:-establo_mart}
      OLTP_HOST: db_oltp
      OLTP_PORT: 5432
      OLTP_DB: ${POSTGRES_DB}
      OLTP_USER: ${POSTGRES_USER}
      OLTP_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg18_mart_data:/var/lib/postgresql
      - ./db/postgres/mart:/docker-entrypoint-initdb.d:ro
    depends_on:
      db_oltp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MART_USER} -d ${MART_DB:-establo_mart}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      # La contraseña debe ser alfanumérica: se inserta en una URL de conexión.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_oltp:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_URL: ${MP_WEBHOOK_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    depends_on:
      db_oltp:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    # Sin `ports`: Dokploy publica vía Traefik (red dokploy-network + labels).
    expose:
      - "80"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.establo-web.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.establo-web.entrypoints=websecure"
      - "traefik.http.routers.establo-web.tls.certResolver=letsencrypt"
      - "traefik.http.services.establo-web.loadbalancer.server.port=80"
      - "traefik.http.middlewares.establo-https.redirectscheme.scheme=https"
      - "traefik.http.routers.establo-web-http.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.establo-web-http.entrypoints=web"
      - "traefik.http.routers.establo-web-http.middlewares=establo-https"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg18_oltp_data:
  pg18_mart_data:

# Red que comparte con Traefik (Dokploy). Debe existir en el host: `docker network ls`.
networks:
  dokploy-network:
    external: true
