<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo_emblema.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0C0A09" />
    <script>
      // Aplica el tema guardado (o el del SO) antes del primer paint.
      (function () {
        try {
          var saved = localStorage.getItem('establo-theme');
          var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
          if (light) document.documentElement.classList.add('light');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', light ? '#f6f1e6' : '#0C0A09');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Sistema IMPULSE de Parrilladas El Establo — gestión comercial de Buyers, Leads, Payers y Customers." />
    <meta property="og:title" content="Parrilladas El Establo — Sistema Comercial IMPULSE" />
    <meta property="og:description" content="Captación, negociación, caja y servicio en un solo lugar. Cortes al carbón, hospitalidad de casa." />
    <meta property="og:image" content="/images/hero_parrillada.jpg" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Parrilladas El Establo — Sistema Comercial IMPULSE</title>
  </head>
  <body class="bg-dark-950 text-arena-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
